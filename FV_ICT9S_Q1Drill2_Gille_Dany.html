<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        section{
    	background-color: #7bbfff;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1,p{
    	text-align: center;
    }
    body{
        font-family: 'Courier New', Courier, monospace;
    }
    input[type="text"], select, textarea, button, input[type="submit"] {
    	width: 94%;
    	padding: 15px;
    	border: 1px solid #2f99eb;
    	border-radius: 30px;
    	text-align: center;
    }
    input[type="submit"]{
        cursor: pointer;
        width: 100%;
    }
    </style>
</head>
<body>
    <header></header>
    <h1>RATE A MOVIE</h1>
    <br>
    <p>This is my personal favorite and a must watch movie.</p>
    </header>
    
    <br>

    <section>
    <form>
        <img style="display: block;" height: 100px; width: 100px; margin: 0 auto; src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC4VdTZ-x98saYAgD9D-W60XGTyLTgW78YFtgkbGHKBQ&s=10" alt="logo"
        <br>
        <label for="movie">Finding Nemo</label>
        <br>
        <input type="text"
        id="movie" name="movie"
        placeholder="Finding Nemo is a movie that talks about Marlin who travels the ocean to find his son Nemo.">
        
        <label for="genre">Genre</label>
        <br>
        <input type="checkbox" id="genre1"
        name="genre1">
        <label for="genre1">Action</label>

         <label for="genre"></label>

        <input type="checkbox" id="genre2"
        name="genre2">
        <label for="genre1">Comedy</label>

         <label for="rate"></label>

         <input type="checkbox" id="genre3"
        name="genre3">
          <label for="genre1">Family</label>

         <label for="rate"></label>

         <input type="checkbox" id="genre4"
        name="genre4">
          <label for="genre1">Adventure</label>

         <label for="rate"></label>

         <input type="checkbox" id="genre5"
        name="genre5">
          <label for="genre1">Fantasy</label>

         <label for="rate"></label>
        <br>
        <input type="radio" id="rate1"
        name="genre1">
        <label for="rate">⭐</label>
        
        <input type="radio" id="rate2"
        name="genre1">
        <label for="rate">⭐⭐</label>

        <input type="radio" id="rate3"
        name="genre1">
        <label for="rate">⭐⭐⭐</label>

         <input type="radio" id="rate4"
        name="genre1">
        <label for="rate">⭐⭐⭐⭐</label>

        <input type="radio" id="rate5"
        name="genre1">
        <label for="rate">⭐⭐⭐⭐⭐</label>
        
        <br>
        <textarea id="review" placeholder="The colorful coral reefs and deep-sea animations make the ocean come alive.This movie teaches us lessons about family. Escapes from sharks and jellyfish" rows="4" cols="40"></textarea>

        <br>
        <input type="submit" id="submit" value="Submit review">

        <br>
        Click<a href="link here" target="_blank"> here</a> for more movie details.
    </form>
    </section>
</body>
</html>
